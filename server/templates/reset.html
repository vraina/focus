{% extends "base.html" %}
{% block title %}New password · YoungWonks Focus{% endblock %}
{% block body %}
<div class="narrow"><div class="card" style="padding:26px">
  <div class="row" style="margin-bottom:16px"><span class="logo" style="width:40px;height:40px;border-radius:11px"></span>
      <div><div style="font-weight:700;font-size:18px">YoungWonks Focus</div><div class="muted small">Choose a new password</div></div></div>
  {% if error %}<p class="err" style="margin:0 0 12px">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}"><input type="hidden" name="t" value="{{ token }}">
    <label for="password">New password (10 characters or more)</label>
    <input class="field" id="password" name="password" type="password" autocomplete="new-password" minlength="10" required autofocus>
    <button class="btn" style="width:100%">Save and sign in</button>
  </form>
</div></div>
{% endblock %}
