{# Whose records are shown: always one person. Offered only when there is a choice to make. #}
{% set options = groups() %}
{% if options|length > 1 %}
<div class="seg" role="group" aria-label="Whose day">
  {% for o in options %}
    <a class="{{ 'on' if view.key == o.key }}" {{ 'aria-current=true' if view.key == o.key }} href="{{ url_for(request.endpoint, who=o.key, **request.view_args) }}">{{ o.label }}</a>
  {% endfor %}
</div>
{% endif %}
