{% extends "base.html" %}
{% block title %}Reset password · YoungWonks Focus{% endblock %}
{% block body %}
<div class="narrow"><div class="card" style="padding:26px">
  <div class="row" style="margin-bottom:16px"><span class="logo" style="width:40px;height:40px;border-radius:11px"></span>
      <div><div style="font-weight:700;font-size:18px">YoungWonks Focus</div><div class="muted small">Reset your password</div></div></div>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="email">Your email</label>
    <input class="field" id="email" name="email" type="email" autocomplete="username" required autofocus>
    <button class="btn" style="width:100%">Email me a link</button>
  </form>
  <p class="small" style="margin:14px 0 0;text-align:center"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</div></div>
{% endblock %}
