{% extends "base.html" %}
{% block title %}Sign in · YoungWonks Focus{% endblock %}
{% block body %}
<div class="narrow">
  <div class="card" style="padding:26px">
    <div class="row" style="margin-bottom:16px"><span class="logo" style="width:40px;height:40px;border-radius:11px"></span>
      <div><div style="font-weight:700;font-size:18px">YoungWonks Focus</div><div class="muted small">Sign in</div></div></div>
    {% if error %}<p class="err" style="margin:0 0 12px">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input class="field" id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input class="field" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn" style="width:100%;margin-top:4px">Sign in</button>
    </form>
    <p class="small" style="margin:14px 0 0;text-align:center"><a href="{{ url_for('forgot') }}">Forgot your password?</a> · <a href="{{ url_for('signup') }}">Create an account</a></p>
  </div>
  <p class="muted small" style="text-align:center;margin-top:14px">Focus tracking for your household. Nothing is ever blocked.</p>
</div>
{% endblock %}
