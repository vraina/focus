services:
  - type: web
    name: youngwonks-focus
    runtime: python
    rootDir: server
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --threads 8 --timeout 120 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: SECRET_KEY          # signs sign-in cookies and the links in emails
        generateValue: true
      - key: MONGODB_URI         # an Atlas user with readWrite on the database below
        sync: false
      - key: MONGODB_DB
        value: focussprint
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM           # e.g. YoungWonks Focus <focus@yourdomain.com>, on a domain verified in Resend
        sync: false
      - key: PARENT_EMAIL        # the owner's account: created on first start, and the only one that can issue invitations
        sync: false
      - key: PARENT_PASSWORD     # the owner's first password (change it later under Settings on the website)
        sync: false
      - key: DOWNLOAD_URL        # optional: overrides the installer link (by default the newest GitHub release)
        sync: false
      - key: FAMILY_DAILY_AI_CALLS  # each family's daily allowance of Claude calls
        value: "600"
      - key: PUBLIC_URL          # e.g. https://youngwonks-focus.onrender.com, used for the links in the email
        sync: false
      - key: TIMEZONE            # the family's time zone, decides when "end of day" is
        value: America/Los_Angeles
      - key: MEDIA_KEEP_DAYS     # pictures and clips older than this are deleted from Atlas; the switch records stay
        value: "14"
      - key: DIGEST_HOUR         # 24-hour clock: the daily summary goes out at 9 pm
        value: "21"
